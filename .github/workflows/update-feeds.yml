name: Update pending feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feeds into pending files
        run: node scripts/fetch-feeds.cjs

      - name: Commit changes
        run: |
          git config user.name "pleadlaw-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/news-pending.json public/jobs-pending.json
          git diff --staged --quiet || git commit -m "Update pending feeds"
          git push
